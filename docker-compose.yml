services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: claude
      POSTGRES_DB: claude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude -d claude"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://claude:claude@postgres:5432/claude?sslmode=disable
      # Required: set API_KEYS in .env or your shell, or the API refuses to start.
      API_KEYS: ${API_KEYS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
