# Render Blueprint: deploys the API as a Docker web service connected to the
# existing "demo-test" PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: catalogue-api
    runtime: docker
    plan: free
    region: oregon
    branch: claude/cool-davinci-eiu7yn
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Internal connection string of the database, injected by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: demo-test
          property: connectionString
      # Random key generated by Render; read it in the dashboard
      # (service > Environment). Add more keys separated by commas.
      - key: API_KEYS
        generateValue: true
